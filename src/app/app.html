<header class="header">
  <a class="logo" routerLink="/recipes">
    <span class="logo-mark" aria-hidden="true">R</span>
    Recipe Book
  </a>
  <nav aria-label="Main">
    <a class="tab" routerLink="/recipes" routerLinkActive="active">Recipes</a>
    <a class="tab" routerLink="/shopping-list" routerLinkActive="active">Shopping list</a>
  </nav>
  <div class="account">
    @if (isAuthPage()) {
      <a class="tab" routerLink="/login" routerLinkActive="active">Log in</a>
    } @else {
      <a class="btn btn-ghost" routerLink="/login">Log out</a>
    }
  </div>
</header>

<router-outlet />
